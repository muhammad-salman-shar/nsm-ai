name: Stress Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stress_test.yml'
      - 'src/**'
      - 'tests/**'

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install numpy
      - name: Run Stress Tests
        run: python -m unittest tests.test_stress tests.test_parser_v15 tests.test_v15_e2e -v
