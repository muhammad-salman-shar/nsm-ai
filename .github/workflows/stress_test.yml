name: Stress Test
on:
  workflow_dispatch:
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install numpy
      - name: Run Stress Tests
        run: python -m unittest tests.test_stress -v 2>&1 | tail -40
