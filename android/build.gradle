buildscript {
    repositories {
        google()
        maven { url "https://chaquo.com/maven" }
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "com.chaquo.python:gradle:16.1.0"
    }
}

allprojects {
    repositories {
        google()
        maven { url "https://chaquo.com/maven" }
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        mavenCentral()
    }
}
