<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NSM VB - NeuraSaMu</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --surface2: #21262d;
    --text: #e6edf3; --text-dim: #8b949e; --accent: #ff6b35;
    --user-bg: #1f6feb; --nsm-bg: #21262d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  
  /* Fix for mobile viewport height */
  body { 
    background: var(--bg); 
    color: var(--text); 
    display: flex; 
    height: 100vh; 
    height: 100dvh; 
    overflow: hidden; 
  }
  
  /* Sidebar Overlay */
  #sidebar-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); z-index: 99; backdrop-filter: blur(2px);
  }
  #sidebar-overlay.open { display: block; }

  /* Sidebar */
  #sidebar { 
    width: 260px; background: var(--surface); display: flex; flex-direction: column; 
    transition: transform 0.3s ease; border-right: 1px solid #30363d; 
    position: absolute; height: 100%; z-index: 100; transform: translateX(-100%); 
  }
  #sidebar.open { transform: translateX(0); }
  
  #sidebar-header { padding: 16px; border-bottom: 1px solid #30363d; position: relative; }
  .close-btn { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; }
  .close-btn:hover { color: white; }
  
  .btn { background: var(--surface2); color: var(--text); border: 1px solid #30363d; padding: 10px 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; transition: 0.2s; }
  .btn:hover { background: #30363d; }
  .btn-primary { background: var(--accent); color: white; border: none; }
  .btn-primary:hover { background: #ff8555; }
  
  #chat-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .chat-item { padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: 0.2s; }
  .chat-item:hover, .chat-item.active { background: var(--surface2); color: var(--text); }
  
  /* Main Chat */
  #main { flex: 1; display: flex; flex-direction: column; width: 100%; height: 100%; overflow: hidden; }
  header { padding: 12px 20px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; flex-shrink: 0; }
  .menu-btn { background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; padding: 0 10px; }
  #mood-indicator { font-size: 12px; background: var(--surface2); padding: 4px 10px; border-radius: 12px; color: var(--text-dim); }
  
  #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.3s ease; }
  .user-msg { background: var(--user-bg); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .nsm-msg { background: var(--nsm-bg); color: var(--text); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #30363d; }
  .meta { font-size: 11px; color: var(--text-dim); margin-top: 6px; display: block; }
  
  /* Input Area */
  #input-area { padding: 16px; background: var(--surface); border-top: 1px solid #30363d; display: flex; gap: 12px; flex-shrink: 0; }
  #message-input { flex: 1; background: var(--bg); border: 1px solid #30363d; color: var(--text); padding: 14px 18px; border-radius: 24px; font-size: 15px; outline: none; transition: 0.2s; }
  #message-input:focus { border-color: var(--accent); }
  #send-btn { background: var(--accent); color: white; border: none; padding: 0 24px; border-radius: 24px; cursor: pointer; font-weight: bold; }
  
  /* Settings Modal */
  #settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
  .modal-content { background: var(--surface); padding: 24px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid #30363d; }
  .modal-content input { width: 100%; background: var(--bg); border: 1px solid #30363d; color: white; padding: 10px; border-radius: 8px; margin-top: 8px; margin-bottom: 16px; }
  
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .typing-indicator { display: flex; gap: 4px; padding: 4px 8px; }
  .dot { width: 6px; height: 6px; background: var(--text-dim); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
  .dot:nth-child(1) { animation-delay: -0.32s; } .dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
</style>
</head>
<body>

<div id="sidebar-overlay" onclick="toggleSidebar()"></div>

<div id="sidebar">
  <div id="sidebar-header">
    <button class="btn btn-primary" onclick="startNewChat()">+ New Chat</button>
    <button class="btn" style="margin-top:8px;" onclick="openSettings()">⚙️ Settings</button>
    <button class="close-btn" onclick="toggleSidebar()">✕</button>
  </div>
  <div id="chat-list"></div>
</div>

<div id="main">
  <header>
    <div style="display:flex; align-items:center;">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <strong style="margin-left:10px;">NSM VB <span style="color:var(--accent); font-size:12px;">by NeuraSaMu</span></strong>
    </div>
    <div id="mood-indicator">mood: ready</div>
  </header>
  
  <div id="chat-container">
    <div class="msg nsm-msg">Hi! I'm NSM VB. Talk to me, or teach me new words.</div>
  </div>

  <div id="input-area">
    <input type="text" id="message-input" placeholder="Message NSM..." onkeypress="handleEnter(event)" autocomplete="off">
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<div id="settings-modal">
  <div class="modal-content">
    <h2 style="margin-bottom:16px;">Settings</h2>
    <label style="font-size:12px; color:var(--text-dim);">User Name (for memory privacy)</label>
    <input type="text" id="settings-user" placeholder="e.g. salman">
    
    <label style="font-size:12px; color:var(--text-dim);">Local LLM URL (Optional)</label>
    <input type="text" id="settings-url" placeholder="http://127.0.0.1:8080/v1/chat/completions">
    
    <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
    <button class="btn" style="margin-top:8px; background:transparent;" onclick="closeSettings()">Cancel</button>
  </div>
</div>

<script>
  let currentChatId = Date.now().toString();
  let chats = JSON.parse(localStorage.getItem('nsm_chats') || '{}');
  let settings = JSON.parse(localStorage.getItem('nsm_settings') || '{"user": "default"}');

  document.getElementById('settings-user').value = settings.user;
  document.getElementById('settings-url').value = settings.url || "";

  function toggleSidebar() { 
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('open');
  }
  
  function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; toggleSidebar(); }
  function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
  
  function saveSettings() {
    settings.user = document.getElementById('settings-user').value || "default";
    settings.url = document.getElementById('settings-url').value;
    localStorage.setItem('nsm_settings', JSON.stringify(settings));
    closeSettings();
  }

  function loadChatList() {
    const list = document.getElementById('chat-list');
    list.innerHTML = '';
    Object.keys(chats).sort().reverse().forEach(id => {
      const div = document.createElement('div');
      div.className = 'chat-item' + (id === currentChatId ? ' active' : '');
      div.innerText = chats[id].title || "New Chat";
      div.onclick = () => loadChat(id);
      list.appendChild(div);
    });
  }

  function loadChat(id) {
    currentChatId = id;
    const container = document.getElementById('chat-container');
    container.innerHTML = '';
    if(chats[id] && chats[id].messages) {
      chats[id].messages.forEach(m => addMessage(m.text, m.sender, m.meta, false));
    }
    toggleSidebar();
    loadChatList();
  }

  function startNewChat() {
    currentChatId = Date.now().toString();
    chats[currentChatId] = { title: "New Chat", messages: [] };
    document.getElementById('chat-container').innerHTML = '<div class="msg nsm-msg">Hi! I\'m NSM VB. Talk to me, or teach me new words.</div>';
    toggleSidebar();
    loadChatList();
  }

  function addMessage(text, sender, meta, save = true) {
    const container = document.getElementById('chat-container');
    const div = document.createElement('div');
    div.className = `msg ${sender === 'user' ? 'user-msg' : 'nsm-msg'}`;
    div.innerHTML = text + (meta ? `<span class="meta">${meta}</span>` : '');
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;

    if(save) {
      if(!chats[currentChatId]) chats[currentChatId] = { title: text.substring(0, 20), messages: [] };
      if(chats[currentChatId].messages.length === 0) chats[currentChatId].title = text.substring(0, 20);
      chats[currentChatId].messages.push({text, sender, meta});
      localStorage.setItem('nsm_chats', JSON.stringify(chats));
      loadChatList();
    }
  }

  function handleEnter(e) { if(e.key === 'Enter') sendMessage(); }

  async function sendMessage() {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if(!text) return;
    
    addMessage(text, 'user');
    input.value = '';
    
    const container = document.getElementById('chat-container');
    const typingDiv = document.createElement('div');
    typingDiv.className = 'msg nsm-msg typing-indicator';
    typingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    container.appendChild(typingDiv);
    container.scrollTop = container.scrollHeight;

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ text: text, user_id: settings.user })
      });
      const data = await res.json();
      container.removeChild(typingDiv);
      
      const meta = `${data.intent} · ${data.mood}`;
      addMessage(data.response, 'nsm', meta);
      document.getElementById('mood-indicator').innerText = 'mood: ' + data.mood;
    } catch (err) {
      container.removeChild(typingDiv);
      addMessage("Error connecting to brain.", 'nsm', null);
    }
  }

  loadChatList();
  startNewChat();
</script>
</body>
</html>
