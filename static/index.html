<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NSM VB - NeuraSaMu</title>
<style>
  :root[data-theme="dark"] {
    --bg: #0d1117; --surface: #161b22; --surface2: #21262d;
    --text: #e6edf3; --text-dim: #8b949e; --accent: #ff6b35;
    --user-bg: #1f6feb; --nsm-bg: #21262d; --border: #30363d;
  }
  :root[data-theme="light"] {
    --bg: #f6f8fa; --surface: #ffffff; --surface2: #f3f4f6;
    --text: #24292f; --text-dim: #57606a; --accent: #ff6b35;
    --user-bg: #1f6feb; --nsm-bg: #ffffff; --border: #d0d7de;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); display: flex; height: 100vh; height: 100dvh; overflow: hidden; transition: background 0.3s; }
  
  /* SVG ICONS */
  .svg-icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .svg-icon-sm { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .svg-icon-lg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* SIDEBAR */
  #sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; }
  #sidebar-overlay.open { display: block; }
  #sidebar { width: 280px; background: var(--surface); display: flex; flex-direction: column; transition: transform 0.3s; border-right: 1px solid var(--border); position: absolute; height: 100%; z-index: 100; transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #search-box { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; margin: 12px 0; outline: none; }
  #chat-list { flex: 1; overflow-y: auto; padding: 0 12px; display: flex; flex-direction: column; gap: 8px; }
  .chat-item { padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--text); display: flex; justify-content: space-between; align-items: center; background: var(--surface2); }
  .chat-item.active { border-left: 3px solid var(--accent); }
  .chat-item-actions { display: flex; gap: 6px; opacity: 0.6; }
  .icon-btn { background: none; border: none; cursor: pointer; color: var(--text); padding: 4px; display: flex; align-items: center; justify-content: center; }
  .icon-btn:active { color: var(--accent); }
  #sidebar-bottom { padding: 16px; border-top: 1px solid var(--border); }
  .btn-settings { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }

  /* MAIN */
  #main { flex: 1; display: flex; flex-direction: column; width: 100%; height: 100%; overflow: hidden; }
  header { padding: 12px 16px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .header-title { display: flex; align-items: center; gap: 10px; font-weight: bold; }
  .header-actions { display: flex; gap: 6px; }
  .header-actions button { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  
  /* CHAT */
  #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; }
  .msg-wrapper.user { align-self: flex-end; align-items: flex-end; }
  .msg-wrapper.nsm { align-self: flex-start; align-items: flex-start; }
  .msg { padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
  .user .msg { background: var(--user-bg); color: white; border-bottom-right-radius: 4px; }
  .nsm .msg { background: var(--nsm-bg); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
  
  /* BUBBLE ACTIONS */
  .dropdown-menu { display: none; position: absolute; right: 0; top: 100%; margin-top: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); min-width: 180px; z-index: 50; overflow: hidden; }
  .dropdown-menu.open { display: block; }
  .dropdown-menu div { padding: 12px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text); border-bottom: 1px solid var(--border); }
  .dropdown-menu div:last-child { border-bottom: none; }
  .dropdown-menu div:active { background: var(--surface2); }
  .dropdown-menu div svg { color: var(--accent); }

  .msg-actions { display: flex; gap: 10px; margin-top: 6px; opacity: 0.6; }
  .msg-actions button { background: none; border: none; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .msg-actions button:active { color: var(--accent); }
  .edit-input { width: 100%; background: transparent; color: white; border: none; border-bottom: 1px solid white; outline: none; font-size: 15px; }

  /* TYPING ANIMATION */
  .typing-indicator { display: flex; gap: 4px; padding: 16px; background: var(--nsm-bg); border-radius: 16px; border: 1px solid var(--border); width: fit-content; align-self: flex-start; }
  .typing-indicator span { display: block; width: 6px; height: 6px; background: var(--text-dim); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

  /* INPUT */
  #input-area { padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 12px; flex-shrink: 0; }
  #message-input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 14px 18px; border-radius: 24px; outline: none; font-size: 15px; }
  .send-btn { background: var(--accent); color: white; border: none; padding: 0 16px; border-radius: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 52px; height: 48px; transition: background 0.2s; }
  .send-btn.stop { background: #8b2e2e; }

  /* SETTINGS MODAL & SUB-MENUS */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.85); color: #fff; padding: 10px 20px;
    border-radius: 20px; font-size: 14px; z-index: 10000;
    animation: fadeInOut 2s forwards; pointer-events: none;
  }
  @keyframes fadeInOut {
    0% { opacity: 0; bottom: 60px; }
    10% { opacity: 1; bottom: 80px; }
    90% { opacity: 1; bottom: 80px; }
    100% { opacity: 0; bottom: 100px; }
  }

  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  .modal-content { background: var(--surface); padding: 20px; border-radius: 16px; width: 90%; max-width: 400px; border: 1px solid var(--border); max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  
  .settings-menu { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .settings-item { padding: 16px; background: var(--surface2); border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 500; transition: 0.2s; }
  .settings-item:active { background: var(--border); }
  .settings-item-left { display: flex; align-items: center; gap: 12px; }
  
  .settings-view { display: none; flex-direction: column; height: 100%; overflow-y: auto; }
  .settings-view.active { display: flex; }
  .settings-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .back-btn { background: none; border: none; color: var(--text); cursor: pointer; padding: 4px 8px 4px 0; display: flex; align-items: center; }
  .settings-group label { display: block; font-size: 13px; color: var(--text-dim); margin: 12px 0 6px 0; font-weight: 500; }
  .settings-group input, .settings-group select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; outline: none; font-size: 14px; }
  .btn-primary { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: 600; margin-top: auto; }
  .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; margin-top: 8px; display: flex; justify-content: center; align-items: center; gap: 8px;}
  #test-llm-result { margin-top: 10px; font-size: 13px; padding: 10px; border-radius: 8px; display: none; text-align: center; }
</style>
</head>
<body>

<!-- ICON DEFINITIONS (SVG) -->
<svg style="display: none;">
  <symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></symbol>

  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>

  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
  <symbol id="i-paint" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></symbol>

  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></symbol>
</svg>

<div id="pin-screen" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; flex-direction: column; justify-content: center; align-items: center;">
  <svg class="svg-icon-lg" style="color: var(--accent); width: 48px; height: 48px; margin-bottom: 20px;"><use href="#i-lock"/></svg>
  <h2 style="color: var(--accent); margin-bottom: 20px;">NSM is Locked</h2>
  <input type="password" id="pin-input" maxlength="4" placeholder="****" oninput="checkPin()" style="width: 200px; text-align: center; font-size: 24px; letter-spacing: 5px; background: var(--surface); border: 2px solid var(--accent); color: var(--text); padding: 10px; border-radius: 8px; outline: none;">
  <p id="pin-error" style="color:red; margin-top:10px; display:none;">Wrong PIN</p>
</div>

<div id="sidebar-overlay" onclick="closeSidebar()"></div>
<div id="sidebar">
  <div style="padding: 16px;">
    <input type="text" id="search-box" placeholder="Search chats..." oninput="loadChatList(this.value)">
  </div>
  <div id="chat-list"></div>
  <div id="sidebar-bottom">
    <button class="btn-settings" onclick="openSettings()">
      <svg class="svg-icon"><use href="#i-settings"/></svg> Settings
    </button>
  </div>
</div>

<div id="main">
  <header>
    <div class="header-title">
      <button class="icon-btn" onclick="openSidebar()" style="font-size: 20px;"><svg class="svg-icon"><use href="#i-menu"/></svg></button>
      <span>NSM VB</span>
    </div>
    <div class="header-actions" style="position: relative;">
      <button onclick="startNewChat()"><svg class="svg-icon"><use href="#i-plus"/></svg></button>
      <button onclick="toggleMenu(event)"><svg class="svg-icon"><use href="#i-more"/></svg></button>
      <div id="header-menu" class="dropdown-menu">
        <div onclick="deleteCurrentChat(); closeMenu();"><svg class="svg-icon-sm"><use href="#i-trash"/></svg> Delete Chat</div>
        <div onclick="shareCurrentChat(); closeMenu();"><svg class="svg-icon-sm"><use href="#i-share"/></svg> Share Chat</div>
        <div onclick="downloadCurrentChat(); closeMenu();"><svg class="svg-icon-sm"><use href="#i-download"/></svg> Download (.txt)</div>
      </div>
    </div>
  </header>
  
  <div id="chat-container"></div>

  <div id="input-area">
    <input type="text" id="message-input" onkeypress="handleEnter(event)" autocomplete="off">
    <button id="send-btn" class="send-btn" onclick="handleSendClick()">
      <svg class="svg-icon-lg"><use href="#i-send"/></svg>
    </button>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settings-modal" class="modal">
  <div class="modal-content">
    
    <!-- MAIN MENU -->
    <div id="settings-main" class="settings-view active">
      <h2 style="margin-bottom: 16px;">Settings</h2>
      <div class="settings-menu">
        <div class="settings-item" onclick="showSettingsView('general')">
          <div class="settings-item-left"><svg class="svg-icon" style="color: var(--accent);"><use href="#i-paint"/></svg> Appearance</div>
          <svg class="svg-icon-sm"><use href="#i-chevron-right"/></svg>
        </div>
        <div class="settings-item" onclick="showSettingsView('llm')">
          <div class="settings-item-left"><svg class="svg-icon" style="color: var(--accent);"><use href="#i-cpu"/></svg> AI Model</div>
          <svg class="svg-icon-sm"><use href="#i-chevron-right"/></svg>
        </div>
        <div class="settings-item" onclick="showSettingsView('security')">
          <div class="settings-item-left"><svg class="svg-icon" style="color: var(--accent);"><use href="#i-lock"/></svg> Security</div>
          <svg class="svg-icon-sm"><use href="#i-chevron-right"/></svg>
        </div>
        <div class="settings-item" onclick="showSettingsView('data')">
          <div class="settings-item-left"><svg class="svg-icon" style="color: var(--accent);"><use href="#i-database"/></svg> Data & Memory</div>
          <svg class="svg-icon-sm"><use href="#i-chevron-right"/></svg>
        </div>
      </div>
      <button class="btn-secondary" style="margin-top: 20px;" onclick="closeModal('settings-modal')">Close</button>
    </div>

    <!-- GENERAL VIEW -->
    <div id="settings-general" class="settings-view">
      <div class="settings-header">
        <button class="back-btn" onclick="showSettingsView('main')"><svg class="svg-icon"><use href="#i-back"/></svg></button>
        <h2>Appearance</h2>
      </div>
      <div class="settings-group">
        <label>Theme</label>
        <select id="settings-theme" onchange="applyTheme(this.value)">
          <option value="system">System Default</option>
          <option value="dark">Dark Mode</option>
          <option value="light">Light Mode</option>
        </select>
        <label>User Name</label>
        <input type="text" id="settings-user" placeholder="e.g. salman">
      </div>
      <button class="btn-primary" onclick="saveSettings()">Save</button>
    </div>

    <!-- LLM VIEW -->
    <div id="settings-llm" class="settings-view">
      <div class="settings-header">
        <button class="back-btn" onclick="showSettingsView('main')"><svg class="svg-icon"><use href="#i-back"/></svg></button>
        <h2>AI Model</h2>
      </div>
      <div class="settings-group">
        <label>Local LLM URL</label>
        <input type="text" id="settings-url" placeholder="http://127.0.0.1:8080/v1">
        <label>Model Name</label>
        <input type="text" id="settings-model" placeholder="e.g. samu">
        <label>API Key (Optional)</label>
        <input type="password" id="settings-key" placeholder="gsk_...">
        <button class="btn-secondary" onclick="testLLM()">Test Connection</button>
        <div id="test-llm-result"></div>
      </div>
      <button class="btn-primary" onclick="saveSettings()">Save</button>
    </div>

    <!-- SECURITY VIEW -->
    <div id="settings-security" class="settings-view">
      <div class="settings-header">
        <button class="back-btn" onclick="showSettingsView('main')"><svg class="svg-icon"><use href="#i-back"/></svg></button>
        <h2>Security</h2>
      </div>
      <div class="settings-group">
        <label>PIN Lock</label>
        <select id="settings-pin-enabled">
          <option value="off">Disabled</option>
          <option value="on">Enabled</option>
        </select>
        <label>Set 4-digit PIN</label>
        <input type="password" id="settings-pin" maxlength="4" placeholder="****">
      </div>
      <button class="btn-primary" onclick="saveSettings()">Save</button>
    </div>

    <!-- DATA VIEW (BRAIN MANAGER) -->
    <div id="settings-data" class="settings-view">
      <div class="settings-header">
        <button class="back-btn" onclick="showSettingsView('main')"><svg class="svg-icon"><use href="#i-back"/></svg></button>
        <h2>Brain Manager</h2>
      </div>
      
      <!-- Active Brain -->
      <div class="settings-group" style="background: var(--surface2); padding: 12px; border-radius: 10px;">
        <label style="color: var(--accent); font-weight: bold;">Active Brain</label>
        <div style="font-size: 16px; margin-top: 4px;" id="active-brain-name">default</div>
      </div>
      
      <!-- Create New Brain -->
      <div class="settings-group" style="margin-top: 10px;">
        <label>Create New Brain</label>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="new-brain-name" placeholder="e.g. salman" style="margin-bottom:0; flex:1;">
            <button class="btn-secondary" onclick="createNewBrain()" style="margin-top:0; width:auto; padding: 0 16px;">Create</button>
        </div>
      </div>

      <!-- Import Status -->
      <div id="import-status" style="display: none; position: relative; margin-top: 10px; padding: 10px 30px 10px 10px; border-radius: 8px; font-size: 13px;">
        <span id="import-status-text"></span>
        <span onclick="document.getElementById('import-status').style.display='none'" style="position: absolute; top: 8px; right: 10px; cursor: pointer; font-weight: bold; font-size: 16px;">×</span>
      </div>

      <!-- Saved Brains List -->
      <label style="margin-top: 16px; display: block; font-size: 13px; color: var(--text-dim); font-weight: 500;">SAVED BRAINS</label>
      <div id="brains-list" style="margin-top: 8px; max-height: 200px; overflow-y: auto;">
        <div style="color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px;">Loading...</div>
      </div>

      <!-- Actions -->
      <div class="settings-group" style="margin-top: 16px;">
        <button class="btn-secondary" onclick="exportMemory()"><svg class="svg-icon-sm" style="margin-right:8px;"><use href="#i-download"/></svg> Export Current Brain</button>
        <button class="btn-secondary" onclick="document.getElementById('import-file').click()"><svg class="svg-icon-sm" style="margin-right:8px;"><use href="#i-refresh"/></svg> Import Brain File</button>
        <input type="file" id="import-file" style="display:none" accept=".json" multiple onchange="importMemory(event)">
        <button class="btn-secondary" onclick="loadSampleBrain()" style="margin-top: 8px; background: var(--accent); color: white;"><svg class="svg-icon-sm" style="margin-right:8px;"><use href="#i-cpu"/></svg> Generate Salman Brain (Demo)</button>
      </div>
      <button class="btn-primary" onclick="showSettingsView('main')">Back</button>
    </div>

  </div>
</div>

<script>
  let currentChatId = Date.now().toString();
  let chats = JSON.parse(localStorage.getItem('nsm_chats') || '{}');
  let settings = JSON.parse(localStorage.getItem('nsm_settings') || '{"user": "default", "theme": "system", "pinEnabled": "off"}');
  
  let currentController = null;
  let isGenerating = false;

  function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
  }

  function init() {
    applyTheme(settings.theme || 'system');
    document.getElementById('settings-theme').value = settings.theme || 'system';
    document.getElementById('settings-user').value = settings.user || "default";
    document.getElementById('settings-url').value = settings.url || "";
    document.getElementById('settings-model').value = settings.model || "";
    document.getElementById('settings-key').value = settings.key || "";
    document.getElementById('settings-pin-enabled').value = settings.pinEnabled || "off";
    document.getElementById('settings-pin').value = settings.pin || "";
    
    if (settings.pinEnabled === 'on' && settings.pin) document.getElementById('pin-screen').style.display = 'flex';
    if (!chats[currentChatId]) chats[currentChatId] = { title: "New Chat", messages: [] };
    
    renderChat(currentChatId);
    loadChatList();
  }

  function applyTheme(theme) {
    if (theme === 'system') {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    settings.theme = theme;
    localStorage.setItem('nsm_settings', JSON.stringify(settings));
  }

  let touchstartX = 0, touchendX = 0;
  document.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; });
  document.addEventListener('touchend', e => { touchendX = e.changedTouches[0].screenX; 
    if (touchendX < touchstartX - 50) closeSidebar();
    if (touchendX > touchstartX + 50) openSidebar();
  });
  function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-overlay').classList.add('open'); }
  function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-overlay').classList.remove('open'); }

  function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; closeSidebar(); showSettingsView('main'); }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  function showSettingsView(view) {
    document.querySelectorAll('.settings-view').forEach(v => v.classList.remove('active'));
    document.getElementById('settings-' + view).classList.add('active');
    if (view === 'data') loadBrainsList();
  }
  
  function saveSettings() {
    settings.user = document.getElementById('settings-user').value || "default";
    settings.url = document.getElementById('settings-url').value;
    settings.model = document.getElementById('settings-model').value;
    settings.key = document.getElementById('settings-key').value;
    settings.pinEnabled = document.getElementById('settings-pin-enabled').value;
    settings.pin = document.getElementById('settings-pin').value;
    localStorage.setItem('nsm_settings', JSON.stringify(settings));
    showToast("Settings Saved!");
  }

  function loadChatList(query = "") {
    const list = document.getElementById('chat-list');
    list.innerHTML = '';
    Object.keys(chats).sort().reverse().forEach(id => {
      const title = chats[id].title || "New Chat";
      if (query && !title.toLowerCase().includes(query.toLowerCase())) return;
      const item = document.createElement('div');
      item.className = 'chat-item' + (id === currentChatId ? ' active' : '');
      item.innerHTML = `<span onclick="switchChat('${id}')" style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${title}</span>
        <div class="chat-item-actions">
          <button class="icon-btn" onclick="deleteChat('${id}', event)"><svg class="svg-icon-sm"><use href="#i-trash"/></svg></button>
          <button class="icon-btn" onclick="shareChat('${id}', event)"><svg class="svg-icon-sm"><use href="#i-share"/></svg></button>
          <button class="icon-btn" onclick="downloadChat('${id}', event)"><svg class="svg-icon-sm"><use href="#i-download"/></svg></button>
        </div>`;
      list.appendChild(item);
    });
  }
  function switchChat(id) { currentChatId = id; renderChat(id); closeSidebar(); }
  function startNewChat() { currentChatId = Date.now().toString(); chats[currentChatId] = { title: "New Chat", messages: [] }; localStorage.setItem('nsm_chats', JSON.stringify(chats)); renderChat(currentChatId); loadChatList(); }

  function renderChat(id) {
    const container = document.getElementById('chat-container');
    container.innerHTML = '';
    if (!chats[id] || chats[id].messages.length === 0) {
      container.innerHTML = '<div class="msg nsm" style="align-self: center; max-width: 90%;">Hi! I\'m NSM VB. Talk to me, or teach me new words.</div>';
    } else {
      chats[id].messages.forEach((m, idx) => appendBubble(m.sender, m.text, idx));
    }
    container.scrollTop = container.scrollHeight;
  }

  function appendBubble(sender, text, index) {
    const container = document.getElementById('chat-container');
    const wrapper = document.createElement('div');
    wrapper.className = `msg-wrapper ${sender}`;
    const bubble = document.createElement('div');
    bubble.className = 'msg';
    bubble.innerText = text;
    
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    
    if (sender === 'nsm') {
      actions.innerHTML = `
        <button onclick="copyText('${text.replace(/'/g, "\\'")}')"><svg class="svg-icon-sm"><use href="#i-copy"/></svg></button>
        <button onclick="shareText('${text.replace(/'/g, "\\'")}')"><svg class="svg-icon-sm"><use href="#i-share"/></svg></button>
        <button onclick="speakText('${text.replace(/'/g, "\\'")}', this)"><svg class="svg-icon-sm"><use href="#i-volume"/></svg></button>
        <button onclick="retryResponse(${index})"><svg class="svg-icon-sm"><use href="#i-refresh"/></svg></button>
      `;
    } else {
      actions.innerHTML = `
        <button onclick="editMessage(${index}, this)"><svg class="svg-icon-sm"><use href="#i-edit"/></svg></button>
        <button onclick="copyText('${text.replace(/'/g, "\\'")}')"><svg class="svg-icon-sm"><use href="#i-copy"/></svg></button>
      `;
    }
    wrapper.appendChild(bubble);
    wrapper.appendChild(actions);
    container.appendChild(wrapper);
    container.scrollTop = container.scrollHeight;
  }

  function copyText(t) { navigator.clipboard.writeText(t).then(() => alert("Copied!")); }
  function shareText(t) { if(navigator.share) navigator.share({text: t}); }
  
  let currentSpeechText = null;

  function speakText(text, btn) {
    // Use Native Android TTS if available
    if (window.Android && typeof window.Android.speakText === 'function') {
      if (btn.innerText === '⏸️' || btn.innerHTML.includes('i-play')) {
         // If already playing/paused, stop it
         window.Android.stopTTS();
         btn.innerHTML = '<svg class="svg-icon-sm"><use href="#i-volume"/></svg>';
      } else {
         window.Android.speakText(text);
         btn.innerHTML = '<svg class="svg-icon-sm"><use href="#i-pause"/></svg>';
      }
      return;
    }
    
    // Fallback for Browser
    if (!('speechSynthesis' in window)) { showToast("TTS not supported"); return; }

    // If clicking the same text that is currently speaking/paused
    if (currentSpeechText === text) {
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
        btn.innerHTML = '<svg class="svg-icon-sm"><use href="#i-pause"/></svg>';
      } else if (window.speechSynthesis.speaking) {
        window.speechSynthesis.pause();
        btn.innerHTML = '<svg class="svg-icon-sm"><use href="#i-play"/></svg>';
      }
      return;
    }

    // Start new speech
    window.speechSynthesis.cancel();
    currentSpeechText = text;
    
    const utt = new SpeechSynthesisUtterance(text);
    utt.rate = 1.0;
    utt.onend = () => {
      if (currentSpeechText === text) {
        btn.innerHTML = '<svg class="svg-icon-sm"><use href="#i-volume"/></svg>';
        currentSpeechText = null;
      }
    };
    
    window.speechSynthesis.speak(utt);
    btn.innerHTML = '<svg class="svg-icon-sm"><use href="#i-pause"/></svg>';
  }

  function editMessage(index, btn) {
    const chat = chats[currentChatId];
    const wrapper = btn.closest('.msg-wrapper');
    const bubble = wrapper.querySelector('.msg');
    const origText = chat.messages[index].text;
    bubble.innerHTML = `<input type="text" class="edit-input" value="${origText}">
      <div style="display: flex; gap: 8px; margin-top: 8px;">
        <button onclick="submitEdit(${index})" style="background: var(--accent); border: none; color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;">Send</button>
        <button onclick="renderChat('${currentChatId}')" style="background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;">Cancel</button>
      </div>`;
    const input = bubble.querySelector('input');
    input.focus();
    input.onkeypress = (e) => {
      if (e.key === 'Enter') submitEdit(index);
    };
  }

  function submitEdit(index) {
    const chat = chats[currentChatId];
    const allUserBubbles = document.querySelectorAll('.msg-wrapper.user');
    const wrapper = allUserBubbles[allUserBubbles.length - 1];
    if (!wrapper) return;
    const input = wrapper.querySelector('.edit-input');
    if (!input) return;
    const newText = input.value.trim();
    if (!newText) return;
    chat.messages[index].text = newText;
    chat.messages = chat.messages.slice(0, index + 1);
    localStorage.setItem('nsm_chats', JSON.stringify(chats));
    renderChat(currentChatId);
    sendToBrain(newText);
  }

  function retryResponse(index) {
    const chat = chats[currentChatId];
    if (index > 0) {
      const userText = chat.messages[index-1].text;
      chat.messages = chat.messages.slice(0, index);
      localStorage.setItem('nsm_chats', JSON.stringify(chats));
      renderChat(currentChatId);
      sendToBrain(userText);
    }
  }

  function toggleMenu(event) {
    event.stopPropagation();
    document.getElementById('header-menu').classList.toggle('open');
  }
  function closeMenu() {
    document.getElementById('header-menu').classList.remove('open');
  }
  document.addEventListener('click', function(e) {
    const menu = document.getElementById('header-menu');
    if (menu && menu.classList.contains('open') && !e.target.closest('.header-actions')) {
      menu.classList.remove('open');
    }
  });

  function deleteCurrentChat() { deleteChat(currentChatId, null); }
  function shareCurrentChat() { shareChat(currentChatId, null); }
  function downloadCurrentChat() { downloadChat(currentChatId, null); }

  function deleteChat(id, e) {
    if(e) e.stopPropagation();
    if(!confirm("Delete chat?")) return;
    delete chats[id]; localStorage.setItem('nsm_chats', JSON.stringify(chats));
    if(id === currentChatId) startNewChat(); else loadChatList();
  }
  function shareChat(id, e) {
    if(e) e.stopPropagation();
    const text = chats[id].messages.map(m => `${m.sender.toUpperCase()}: ${m.text}`).join('\n');
    if(navigator.share) navigator.share({title: chats[id].title, text: text});
  }
  function downloadChat(id, e) {
    if(e) e.stopPropagation();
    const text = chats[id].messages.map(m => `${m.sender.toUpperCase()}: ${m.text}`).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type: 'text/plain'}));
    a.download = `${chats[id].title}.txt`; a.click();
  }

  function handleSendClick() { if (isGenerating) stopGeneration(); else sendMessage(); }

  function sendMessage() {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if(!text) return;
    const chat = chats[currentChatId];
    if (chat.messages.length === 0) chat.title = text.substring(0, 20);
    chat.messages.push({ sender: 'user', text: text });
    localStorage.setItem('nsm_chats', JSON.stringify(chats));
    renderChat(currentChatId);
    loadChatList();
    input.value = '';
    sendToBrain(text);
  }

  async function sendToBrain(text) {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    isGenerating = true;
    const sendBtn = document.getElementById('send-btn');
    sendBtn.innerHTML = '<svg class="svg-icon-lg"><use href="#i-stop"/></svg>';
    sendBtn.classList.add('stop');

    const container = document.getElementById('chat-container');
    const typing = document.createElement('div');
    typing.className = 'typing-indicator';
    typing.innerHTML = '<span></span><span></span><span></span>';
    container.appendChild(typing);
    container.scrollTop = container.scrollHeight;

    currentController = new AbortController();

    try {
      const res = await fetch('/chat', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ text: text, user_id: settings.user, llm_url: settings.url, llm_model: settings.model, llm_key: settings.key }),
        signal: currentController.signal
      });
      if (!res.ok) {
        let errBody = "";
        try { errBody = await res.text(); } catch(e) {}
        throw new Error("Server " + res.status + ": " + errBody.substring(0, 150));
      }
      const data = await res.json();
      if (container.contains(typing)) container.removeChild(typing);
      const chat = chats[currentChatId];
      chat.messages.push({ sender: 'nsm', text: data.response });
      localStorage.setItem('nsm_chats', JSON.stringify(chats));
      renderChat(currentChatId);
    } catch (err) {
      if (container.contains(typing)) container.removeChild(typing);
      let errorMsg = "Error connecting to brain.";
      if (err.name === 'AbortError') {
        errorMsg = "Generation stopped by user.";
      } else if (err.message) {
        errorMsg = "Error: " + err.message;
      }
      appendBubble('nsm', errorMsg, chats[currentChatId].messages.length);
    } finally {
      isGenerating = false;
      sendBtn.innerHTML = '<svg class="svg-icon-lg"><use href="#i-send"/></svg>';
      sendBtn.classList.remove('stop');
      currentController = null;
    }
  }
  function stopGeneration() { if (currentController) currentController.abort(); }

  // ===== BRAIN MANAGER FUNCTIONS (added later) =====
  async function loadBrainsList() {
    const list = document.getElementById('brains-list');
    const activeName = document.getElementById('active-brain-name');
    if (!list) return;
    if (activeName) activeName.innerText = settings.user || 'default';
    
    try {
      const res = await fetch('/brains');
      const data = await res.json();
      const brains = data.brains || [];
      
      if (brains.length === 0) {
        list.innerHTML = '<div style="color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px;">No brains saved yet</div>';
        return;
      }
      
      list.innerHTML = brains.map(brain => {
        const isActive = brain === settings.user;
        return '<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; background: ' + (isActive ? 'var(--surface2)' : 'transparent') + '; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px;">' +
          '<span style="font-size: 14px; font-weight: ' + (isActive ? 'bold' : 'normal') + '; color: ' + (isActive ? 'var(--accent)' : 'var(--text)') + ';">' + brain + (isActive ? ' (active)' : '') + '</span>' +
          '<div style="display: flex; gap: 6px;">' +
          (!isActive ? '<button onclick="switchBrain(\'' + brain + '\')" style="background: var(--accent); color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;">Load</button>' : '') +
          '<button onclick="deleteBrain(\'' + brain + '\')" style="background: #8b2e2e; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;">Delete</button>' +
          '</div></div>';
      }).join('');
    } catch(e) {
      list.innerHTML = '<div style="color: #8b2e2e; font-size: 13px; text-align: center; padding: 20px;">Failed to load brains: ' + e.message + '</div>';
    }
  }

  async function switchBrain(brainId) {
    settings.user = brainId;
    localStorage.setItem('nsm_settings', JSON.stringify(settings));
    const userInput = document.getElementById('settings-user');
    if (userInput) userInput.value = brainId;
    showToast('Switched to brain: ' + brainId);
    loadBrainsList();
  }

  async function deleteBrain(brainId) {
    if (!confirm('Delete brain "' + brainId + '"? This will delete all its memory forever.')) return;
    try {
      await fetch('/delete_brain', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user_id: brainId })
      });
      showToast('Deleted: ' + brainId);
      
      // If we deleted the active brain, switch to default
      if (brainId === settings.user) {
        settings.user = 'default';
        localStorage.setItem('nsm_settings', JSON.stringify(settings));
        document.getElementById('settings-user').value = 'default';
      }
      loadBrainsList();
    } catch(e) {
      showToast('Failed to delete: ' + e.message);
    }
  }

  async function importMemory(event) {
    const files = event.target.files;
    if(!files || files.length === 0) return;
    
    const statusBox = document.getElementById('import-status');
    if (statusBox) {
      statusBox.style.display = 'block';
      statusBox.style.background = 'var(--surface2)';
      statusBox.style.color = 'var(--text)';
      statusBox.innerText = 'Importing ' + files.length + ' file(s)...';
    }

    let successCount = 0, failCount = 0, errors = [];

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const fileData = await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.readAsText(file);
      });
      
      try {
        const brainData = JSON.parse(fileData);
        const res = await fetch('/import', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ user_id: settings.user, brain_data: brainData, mode: 'merge' })
        });
        const result = await res.json();
        if (result.ok) {
          successCount++;
        } else {
          failCount++;
          errors.push(file.name + ': ' + (result.error || 'Unknown'));
        }
      } catch(e) {
        failCount++;
        errors.push(file.name + ': ' + e.message);
      }
    }

    if (statusBox) {
      const textSpan = document.getElementById('import-status-text');
      if (successCount > 0) {
        statusBox.style.background = '#238636';
        statusBox.style.color = 'white';
        textSpan.innerHTML = '✅ Success! Brain memory updated. You can close this.';
        setTimeout(() => loadBrainsList(), 500);
      } else {
        statusBox.style.background = '#8b2e2e';
        statusBox.style.color = 'white';
        textSpan.innerHTML = '❌ Import failed:<br>' + (errors.length > 0 ? errors.join('<br>') : 'Unknown error');
      }
    }
    event.target.value = '';
  }


  async function createNewBrain() {
    const name = document.getElementById('new-brain-name').value.trim();
    if (!name) { showToast("Enter a brain name"); return; }
    
    // Switch to this new brain
    settings.user = name;
    localStorage.setItem('nsm_settings', JSON.stringify(settings));
    document.getElementById('settings-user').value = name;
    document.getElementById('active-brain-name').innerText = name;
    
    // Create an empty brain in DB
    try {
      await fetch('/import', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user_id: name, brain_data: { version: 1, definitions: {}, relations: {}, lexicon: {}, episodes: [], facts: {}, affect: {drives:{},hormones:{}} }, mode: 'replace' })
      });
      showToast("Created & Switched to: " + name);
      document.getElementById('new-brain-name').value = '';
      loadBrainsList();
    } catch(e) { showToast("Error creating brain"); }
  }

  async function exportMemory() {
    showToast("Exporting brain...");
    try {
      const res = await fetch('/export', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user_id: settings.user })
      });
      if (!res.ok) throw new Error("Server error " + res.status);
      
      const data = await res.json();
      const jsonStr = JSON.stringify(data, null, 2);
      const fileName = `NSM_Memory_${settings.user}.json`;

      // Use Native Android Share if available
      if (window.Android && typeof window.Android.shareBrain === 'function') {
        window.Android.shareBrain(jsonStr, fileName);
        showToast("Opening Share Menu...");
      } else {
        // Fallback for Browser
        const blob = new Blob([jsonStr], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; 
        a.download = fileName;
        document.body.appendChild(a);
        a.click(); 
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("Exported successfully!");
      }
    } catch(e) { 
      showToast("Export failed: " + e.message); 
    }
  }

  async function loadSampleBrain() {
    showToast("Generating Salman Brain...");
    const sampleBrain = {
      "version": 1, "turn": 5, "max_depth": 5,
      "definitions": {
        "ai": "Artificial Intelligence - machines that simulate human intelligence",
        "scientist": "a person who studies or practices science",
        "researcher": "a person who conducts research and investigations",
        "human": "a man, woman, or child of the species Homo sapiens",
        "code": "instructions written for a computer to execute"
      },
      "facts": { "name": "Salman", "profession": "AI Scientist and Researcher", "age": 25 },
      "relations": {
        "IS|salman": {
          "human": {"count": 1, "first_seen": 1730400000.0, "last_seen": 1730400000.0, "superseded": false, "source": "user"},
          "researcher": {"count": 1, "first_seen": 1730400000.0, "last_seen": 1730400000.0, "superseded": false, "source": "user"},
          "scientist": {"count": 1, "first_seen": 1730400000.0, "last_seen": 1730400000.0, "superseded": false, "source": "user"}
        },
        "CAN|salman": {
          "code": {"count": 1, "first_seen": 1730400000.0, "last_seen": 1730400000.0, "superseded": false, "source": "user"}
        }
      },
      "lexicon": { "salman": {"count": 1, "contexts": []}, "ai": {"count": 1, "contexts": []} },
      "episodes": [],
      "affect": {"drives": {}, "hormones": {}}
    };
    
    try {
      const res = await fetch('/import', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user_id: 'salman', brain_data: sampleBrain, mode: 'replace' })
      });
      const result = await res.json();
      if (result.ok) {
        showToast("Salman Brain Loaded! Switching...");
        settings.user = 'salman';
        localStorage.setItem('nsm_settings', JSON.stringify(settings));
        loadBrainsList();
        document.getElementById('active-brain-name').innerText = 'salman';
      } else {
        showToast("Failed: " + result.error);
      }
    } catch(e) { showToast("Error: " + e.message); }
  }

  init();
</script>
</body>
</html>
