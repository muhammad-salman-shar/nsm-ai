<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSM VB</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0d1117; color: #e6edf3;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 20px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .mood {
    font-size: 12px; color: #8b949e;
    background: #21262d; padding: 4px 10px; border-radius: 12px;
  }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px;
         font-size: 14px; line-height: 1.5; word-wrap: break-word; }
  .user { background: #1f6feb; color: white; align-self: flex-end;
          border-bottom-right-radius: 4px; }
  .nsm { background: #21262d; color: #e6edf3; align-self: flex-start;
         border-bottom-left-radius: 4px; }
  .meta { font-size: 11px; color: #7d8590; margin-top: 4px; }
  form {
    padding: 12px 16px; background: #161b22;
    border-top: 1px solid #30363d;
    display: flex; gap: 8px;
  }
  input {
    flex: 1; padding: 10px 14px; border-radius: 8px;
    border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
    font-size: 14px; outline: none;
  }
  input:focus { border-color: #1f6feb; }
  button {
    padding: 10px 20px; border-radius: 8px; border: none;
    background: #238636; color: white; font-size: 14px;
    cursor: pointer; font-weight: 500;
  }
  button:hover { background: #2ea043; }
  button:disabled { background: #30363d; cursor: not-allowed; }
  #reset { background: #6e2121; }
  #reset:hover { background: #8b2e2e; }
</style>
</head>
<body>
<header>
  <h1>NSM VB — NeuraSaMu Virtual Brain</h1>
  <div>
    <span class="mood" id="mood">mood: —</span>
    <button id="reset" onclick="resetBrain()" style="margin-left:8px;padding:4px 10px;font-size:12px;">reset</button>
  </div>
</header>
<div id="chat"></div>
<form id="form" onsubmit="sendMessage(event)">
  <input id="input" type="text" placeholder="talk to NSM VB..." autocomplete="off" autofocus>
  <button type="submit" id="send">send</button>
</form>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const moodEl = document.getElementById("mood");

function addMsg(text, cls, meta) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  if (meta) {
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = meta;
    div.appendChild(m);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(e) {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, "user");
  input.value = "";
  sendBtn.disabled = true;
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text})
    });
    const data = await res.json();
    const meta = [data.intent, data.mood, data.recall ? "recall: " + data.recall : null]
      .filter(Boolean).join(" · ");
    addMsg(data.response, "nsm", meta);
    moodEl.textContent = "mood: " + (data.mood || "—");
  } catch (err) {
    addMsg("(error: " + err.message + ")", "nsm");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

async function resetBrain() {
  if (!confirm("Reset NSM VB? Sab kuch bhool jaayega.")) return;
  try {
    await fetch("/reset", {method: "POST"});
    chat.innerHTML = "";
    moodEl.textContent = "mood: —";
    addMsg("NSM VB reset. Fresh start.", "nsm");
  } catch (err) {
    addMsg("(reset error: " + err.message + ")", "nsm");
  }
}

addMsg("Hi! I'm NSM VB. Talk to me, or teach me new words.", "nsm");
</script>
</body>
</html>
