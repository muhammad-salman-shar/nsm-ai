<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NSM VB - NeuraSaMu</title>
<style>
  /* --- THEMES --- */
  :root[data-theme="dark"] {
    --bg: #0d1117; --surface: #161b22; --surface2: #21262d;
    --text: #e6edf3; --text-dim: #8b949e; --accent: #ff6b35;
    --user-bg: #1f6feb; --nsm-bg: #21262d; --border: #30363d;
  }
  :root[data-theme="light"] {
    --bg: #f6f8fa; --surface: #ffffff; --surface2: #f3f4f6;
    --text: #24292f; --text-dim: #57606a; --accent: #ff6b35;
    --user-bg: #1f6feb; --nsm-bg: #ffffff; --border: #d0d7de;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); display: flex; height: 100vh; height: 100dvh; overflow: hidden; transition: background 0.3s, color 0.3s; }
  
  /* --- SIDEBAR --- */
  #sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; }
  #sidebar-overlay.open { display: block; }
  #sidebar { width: 280px; background: var(--surface); display: flex; flex-direction: column; transition: transform 0.3s; border-right: 1px solid var(--border); position: absolute; height: 100%; z-index: 100; transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #search-box { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; margin: 12px 0; outline: none; }
  #chat-list { flex: 1; overflow-y: auto; padding: 0 12px; display: flex; flex-direction: column; gap: 8px; }
  .chat-item { padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--text); display: flex; justify-content: space-between; align-items: center; background: var(--surface2); }
  .chat-item.active { border-left: 3px solid var(--accent); }
  .chat-item-actions { display: flex; gap: 6px; opacity: 0.6; }
  .action-icon { background: none; border: none; cursor: pointer; color: var(--text); font-size: 16px; padding: 4px; }
  #sidebar-bottom { padding: 16px; border-top: 1px solid var(--border); text-align: right; }
  .btn-settings { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }

  /* --- MAIN UI --- */
  #main { flex: 1; display: flex; flex-direction: column; width: 100%; height: 100%; overflow: hidden; }
  header { padding: 12px 16px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .header-title { display: flex; align-items: center; gap: 10px; font-weight: bold; }
  .header-actions { display: flex; gap: 8px; }
  .header-actions button { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 8px; cursor: pointer; font-size: 16px; }
  
  /* --- CHAT --- */
  #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; }
  .msg-wrapper.user { align-self: flex-end; align-items: flex-end; }
  .msg-wrapper.nsm { align-self: flex-start; align-items: flex-start; }
  .msg { padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
  .user .msg { background: var(--user-bg); color: white; border-bottom-right-radius: 4px; }
  .nsm .msg { background: var(--nsm-bg); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
  
  /* BUBBLE ACTIONS */
  .msg-actions { display: flex; gap: 8px; margin-top: 4px; opacity: 0.7; transition: opacity 0.2s; }
  .msg-actions:hover { opacity: 1; }
  .msg-actions button { background: none; border: none; color: var(--text-dim); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 2px; }
  .msg-actions button:hover { color: var(--accent); }
  .edit-input { width: 100%; background: transparent; color: white; border: none; border-bottom: 1px solid white; outline: none; font-size: 15px; font-family: inherit; }

  /* --- INPUT AREA --- */
  #input-area { padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 12px; flex-shrink: 0; }
  #message-input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 14px 18px; border-radius: 24px; outline: none; font-size: 15px; }
  #send-btn { background: var(--accent); color: white; border: none; padding: 0 24px; border-radius: 24px; font-weight: bold; cursor: pointer; }

  /* --- MODALS & SETTINGS --- */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  .modal-content { background: var(--surface); padding: 24px; border-radius: 16px; width: 90%; max-width: 450px; border: 1px solid var(--border); max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .modal h2 { margin-bottom: 20px; font-size: 22px; font-weight: 600; }
  .settings-group { background: var(--bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
  .settings-group label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .settings-group input, .settings-group select { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; margin-bottom: 12px; outline: none; font-size: 14px; }
  .settings-group input:last-child { margin-bottom: 0; }
  .btn-primary { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: 600; font-size: 16px; }
  .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 14px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: 600; font-size: 16px; margin-top: 8px; }
  #test-llm-result { margin-top: 10px; font-size: 13px; padding: 10px; border-radius: 8px; display: none; text-align: center; font-weight: 500; }
</style>
</head>
<body>

<!-- PIN LOCK SCREEN -->
<div id="pin-screen" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; flex-direction: column; justify-content: center; align-items: center;">
  <h2 style="color: var(--accent); margin-bottom: 20px;">🔒 NSM is Locked</h2>
  <input type="password" id="pin-input" maxlength="4" placeholder="****" oninput="checkPin()" style="width: 200px; text-align: center; font-size: 24px; letter-spacing: 5px; background: var(--surface); border: 2px solid var(--accent); color: var(--text); padding: 10px; border-radius: 8px; outline: none;">
  <p id="pin-error" style="color:red; margin-top:10px; display:none;">Wrong PIN</p>
</div>

<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<div id="sidebar">
  <div style="padding: 16px;">
    <input type="text" id="search-box" placeholder="Search chats..." oninput="loadChatList(this.value)">
  </div>
  <div id="chat-list"></div>
  <div id="sidebar-bottom">
    <button class="btn-settings" onclick="openSettings()">⚙️ Settings</button>
  </div>
</div>

<div id="main">
  <header>
    <div class="header-title">
      <button class="action-icon" onclick="openSidebar()">☰</button>
      <span>NSM VB</span>
    </div>
    <div class="header-actions">
      <button onclick="startNewChat()">+</button>
      <button onclick="deleteCurrentChat()">🗑️</button>
      <button onclick="shareCurrentChat()">🔗</button>
      <button onclick="downloadCurrentChat()">⬇️</button>
    </div>
  </header>
  
  <div id="chat-container"></div>

  <div id="input-area">
    <input type="text" id="message-input" onkeypress="handleEnter(event)" autocomplete="off">
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settings-modal" class="modal">
  <div class="modal-content">
    <h2>Settings</h2>
    
    <div class="settings-group">
      <label>Theme</label>
      <select id="settings-theme" onchange="applyTheme(this.value)">
        <option value="system">System Default</option>
        <option value="dark">Dark Mode</option>
        <option value="light">Light Mode</option>
      </select>
    </div>

    <div class="settings-group">
      <label>User Name (Private Memory)</label>
      <input type="text" id="settings-user" placeholder="e.g. salman">
    </div>
    
    <div class="settings-group">
      <label>Local LLM URL</label>
      <input type="text" id="settings-url" placeholder="http://127.0.0.1:8080/v1">
      <label>Model Name</label>
      <input type="text" id="settings-model" placeholder="e.g. samu">
      <label>API Key (Optional)</label>
      <input type="password" id="settings-key" placeholder="gsk_...">
      <button class="btn-secondary" onclick="testLLM()">🔗 Test LLM Connection</button>
      <div id="test-llm-result"></div>
    </div>

    <div class="settings-group">
      <label>PIN Lock</label>
      <select id="settings-pin-enabled">
        <option value="off">Disabled</option>
        <option value="on">Enabled</option>
      </select>
      <input type="password" id="settings-pin" maxlength="4" placeholder="Set 4-digit PIN">
    </div>

    <div class="settings-group">
      <label>Memory Backup</label>
      <button class="btn-secondary" onclick="exportMemory()" style="margin-top: 0;">⬇️ Export Memory</button>
      <button class="btn-secondary" onclick="document.getElementById('import-file').click()">⬆️ Import Memory</button>
      <input type="file" id="import-file" style="display:none" accept=".json" multiple onchange="importMemory(event)">
    </div>

    <button class="btn-primary" onclick="saveSettings()">Save Settings</button>
    <button class="btn-secondary" onclick="closeModal('settings-modal')">Cancel</button>
  </div>
</div>

<script>
  let currentChatId = Date.now().toString();
  let chats = JSON.parse(localStorage.getItem('nsm_chats') || '{}');
  let settings = JSON.parse(localStorage.getItem('nsm_settings') || '{"user": "default", "theme": "system", "pinEnabled": "off"}');

  // --- INITIALIZATION ---
  function init() {
    applyTheme(settings.theme || 'system');
    
    document.getElementById('settings-theme').value = settings.theme || 'system';
    document.getElementById('settings-user').value = settings.user || "default";
    document.getElementById('settings-url').value = settings.url || "";
    document.getElementById('settings-model').value = settings.model || "";
    document.getElementById('settings-key').value = settings.key || "";
    document.getElementById('settings-pin-enabled').value = settings.pinEnabled || "off";
    document.getElementById('settings-pin').value = settings.pin || "";
    
    if (settings.pinEnabled === 'on' && settings.pin) {
      document.getElementById('pin-screen').style.display = 'flex';
    }
    
    if (!chats[currentChatId]) {
      chats[currentChatId] = { title: "New Chat", messages: [] };
    }
    renderChat(currentChatId);
    loadChatList();
  }

  // --- THEME ---
  function applyTheme(theme) {
    if (theme === 'system') {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    settings.theme = theme;
    localStorage.setItem('nsm_settings', JSON.stringify(settings));
  }

  // --- SIDEBAR SWIPE ---
  let touchstartX = 0;
  let touchendX = 0;
  function handleGesture() {
    if (touchendX < touchstartX - 50) closeSidebar(); // Swipe left
    if (touchendX > touchstartX + 50) openSidebar();  // Swipe right
  }
  document.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; });
  document.addEventListener('touchend', e => { touchendX = e.changedTouches[0].screenX; handleGesture(); });

  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebar-overlay').classList.add('open');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
  }

  // --- SECURITY ---
  function checkPin() {
    const val = document.getElementById('pin-input').value;
    if (val === settings.pin) {
      document.getElementById('pin-screen').style.display = 'none';
      document.getElementById('pin-error').style.display = 'none';
      document.getElementById('pin-input').value = "";
    } else if (val.length === 4) {
      document.getElementById('pin-error').style.display = 'block';
      document.getElementById('pin-input').value = "";
    }
  }

  // --- CHAT LIST ---
  function loadChatList(query = "") {
    const list = document.getElementById('chat-list');
    list.innerHTML = '';
    Object.keys(chats).sort().reverse().forEach(id => {
      const title = chats[id].title || "New Chat";
      if (query && !title.toLowerCase().includes(query.toLowerCase())) return;
      
      const item = document.createElement('div');
      item.className = 'chat-item' + (id === currentChatId ? ' active' : '');
      
      const text = document.createElement('span');
      text.innerText = title;
      text.onclick = () => { currentChatId = id; renderChat(id); closeSidebar(); };
      
      const actions = document.createElement('div');
      actions.className = 'chat-item-actions';
      actions.innerHTML = `
        <button class="action-icon" onclick="deleteChat('${id}', event)">🗑️</button>
        <button class="action-icon" onclick="shareChat('${id}', event)">🔗</button>
        <button class="action-icon" onclick="downloadChat('${id}', event)">⬇️</button>
      `;
      
      item.appendChild(text);
      item.appendChild(actions);
      list.appendChild(item);
    });
  }

  function startNewChat() {
    currentChatId = Date.now().toString();
    chats[currentChatId] = { title: "New Chat", messages: [] };
    localStorage.setItem('nsm_chats', JSON.stringify(chats));
    renderChat(currentChatId);
    loadChatList();
  }

  // --- RENDER CHAT ---
  function renderChat(id) {
    const container = document.getElementById('chat-container');
    container.innerHTML = '';
    const chat = chats[id];
    if (!chat) return;
    
    if (chat.messages.length === 0) {
      container.innerHTML = '<div class="msg nsm" style="align-self: center; text-align: center; max-width: 90%;">Hi! I\'m NSM VB. Talk to me, or teach me new words.</div>';
    } else {
      chat.messages.forEach((m, idx) => appendBubble(m.sender, m.text, idx));
    }
    container.scrollTop = container.scrollHeight;
  }

  function appendBubble(sender, text, index) {
    const container = document.getElementById('chat-container');
    const wrapper = document.createElement('div');
    wrapper.className = `msg-wrapper ${sender}`;
    
    const bubble = document.createElement('div');
    bubble.className = 'msg';
    bubble.innerText = text;
    
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    
    if (sender === 'nsm') {
      actions.innerHTML = `
        <button onclick="copyText('${text.replace(/'/g, "\\'")}')">📋 Copy</button>
        <button onclick="shareText('${text.replace(/'/g, "\\'")}')">🔗 Share</button>
        <button onclick="readAloud('${text.replace(/'/g, "\\'")}')">🔊 Read</button>
        <button onclick="retryResponse(${index})">🔄 Retry</button>
      `;
    } else {
      actions.innerHTML = `
        <button onclick="editMessage(${index}, this)">✏️ Edit</button>
        <button onclick="copyText('${text.replace(/'/g, "\\'")}')">📋 Copy</button>
      `;
    }
    
    wrapper.appendChild(bubble);
    wrapper.appendChild(actions);
    container.appendChild(wrapper);
  }

  // --- BUBBLE ACTIONS ---
  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => alert("Copied!"));
  }
  
  function shareText(text) {
    if (navigator.share) navigator.share({ text: text });
    else alert("Sharing not supported.");
  }
  
  function readAloud(text) {
    if ('speechSynthesis' in window) {
      const utt = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.speak(utt);
    } else alert("TTS not supported.");
  }

  function editMessage(index, btn) {
    const chat = chats[currentChatId];
    const wrapper = btn.closest('.msg-wrapper');
    const bubble = wrapper.querySelector('.msg');
    const originalText = chat.messages[index].text;
    
    bubble.innerHTML = `<input type="text" class="edit-input" value="${originalText}">`;
    const input = bubble.querySelector('input');
    input.focus();
    
    input.onkeypress = (e) => {
      if (e.key === 'Enter') {
        const newText = input.value.trim();
        if (newText) {
          chat.messages[index].text = newText;
          chat.messages = chat.messages.slice(0, index + 1); // Remove everything after
          localStorage.setItem('nsm_chats', JSON.stringify(chats));
          renderChat(currentChatId);
          sendToBrain(newText);
        }
      }
    };
  }

  async function retryResponse(index) {
    const chat = chats[currentChatId];
    if (index > 0 && chat.messages[index-1].sender === 'user') {
      const userText = chat.messages[index-1].text;
      chat.messages = chat.messages.slice(0, index); // Remove the NSM response
      localStorage.setItem('nsm_chats', JSON.stringify(chats));
      renderChat(currentChatId);
      sendToBrain(userText);
    }
  }

  // --- TOP BAR ACTIONS ---
  function deleteCurrentChat() { deleteChat(currentChatId, null); }
  function shareCurrentChat() { shareChat(currentChatId, null); }
  function downloadCurrentChat() { downloadChat(currentChatId, null); }

  function deleteChat(id, event) {
    if (event) event.stopPropagation();
    if (!confirm("Delete this chat?")) return;
    delete chats[id];
    localStorage.setItem('nsm_chats', JSON.stringify(chats));
    if (id === currentChatId) startNewChat();
    else loadChatList();
  }

  function shareChat(id, event) {
    if (event) event.stopPropagation();
    const chat = chats[id];
    if (!chat) return;
    const text = chat.messages.map(m => `${m.sender.toUpperCase()}: ${m.text}`).join('\n\n');
    if (navigator.share) navigator.share({ title: chat.title, text: text });
    else alert("Sharing not supported.");
  }

  function downloadChat(id, event) {
    if (event) event.stopPropagation();
    const chat = chats[id];
    if (!chat) return;
    const text = chat.messages.map(m => `${m.sender.toUpperCase()}: ${m.text}`).join('\n\n');
    const blob = new Blob([text], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${chat.title}.txt`;
    a.click();
  }

  // --- SETTINGS LOGIC ---
  function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; closeSidebar(); }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  function saveSettings() {
    settings.user = document.getElementById('settings-user').value || "default";
    settings.url = document.getElementById('settings-url').value;
    settings.model = document.getElementById('settings-model').value;
    settings.key = document.getElementById('settings-key').value;
    settings.pinEnabled = document.getElementById('settings-pin-enabled').value;
    settings.pin = document.getElementById('settings-pin').value;
    localStorage.setItem('nsm_settings', JSON.stringify(settings));
    closeModal('settings-modal');
    alert("Settings Saved!");
  }

  async function testLLM() {
    const resultBox = document.getElementById('test-llm-result');
    resultBox.style.display = 'block';
    resultBox.style.background = 'var(--surface2)';
    resultBox.style.color = 'var(--text)';
    resultBox.innerText = 'Testing connection...';
    
    const url = document.getElementById('settings-url').value;
    const model = document.getElementById('settings-model').value;
    const key = document.getElementById('settings-key').value;
    
    if (!url || !model) {
      resultBox.style.background = '#8b2e2e'; resultBox.style.color = 'white';
      resultBox.innerText = '❌ URL and Model Name required';
      return;
    }
    
    try {
      const res = await fetch('/test_llm', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ llm_url: url, llm_model: model, llm_key: key })
      });
      const data = await res.json();
      if (data.ok) {
        resultBox.style.background = '#238636'; resultBox.style.color = 'white';
        resultBox.innerText = '✅ Connected! Response: ' + data.response;
      } else {
        resultBox.style.background = '#8b2e2e'; resultBox.style.color = 'white';
        resultBox.innerText = '❌ ' + data.error;
      }
    } catch(e) {
      resultBox.style.background = '#8b2e2e'; resultBox.style.color = 'white';
      resultBox.innerText = '❌ ' + e.message;
    }
  }

  async function exportMemory() {
    try {
      const res = await fetch('/export', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user_id: settings.user })
      });
      const data = await res.json();
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `NSM_Memory_${settings.user}.json`;
      a.click(); URL.revokeObjectURL(url);
    } catch(e) { alert("Export failed!"); }
  }

  async function importMemory(event) {
    const files = event.target.files;
    if(!files || files.length === 0) return;
    let successCount = 0, failCount = 0;
    
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const fileData = await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.readAsText(file);
      });
      try {
        const brainData = JSON.parse(fileData);
        const res = await fetch('/import', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ user_id: settings.user, brain_data: brainData, mode: 'merge' })
        });
        const result = await res.json();
        if (result.ok) successCount++; else failCount++;
      } catch(e) { failCount++; }
    }
    alert(`Import Complete!\\n✅ Success: ${successCount}\\n❌ Failed: ${failCount}`);
    if (successCount > 0) window.location.reload();
  }

  // --- CHAT LOGIC ---
  function handleEnter(e) { if(e.key === 'Enter') sendMessage(); }

  function sendMessage() {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if(!text) return;
    
    const chat = chats[currentChatId];
    if (chat.messages.length === 0) chat.title = text.substring(0, 20);
    
    chat.messages.push({ sender: 'user', text: text });
    appendBubble('user', text, chat.messages.length - 1);
    localStorage.setItem('nsm_chats', JSON.stringify(chats));
    loadChatList();
    input.value = '';
    
    sendToBrain(text);
  }

  async function sendToBrain(text) {
    const container = document.getElementById('chat-container');
    const typing = document.createElement('div');
    typing.className = 'msg nsm';
    typing.innerText = '...';
    container.appendChild(typing);
    container.scrollTop = container.scrollHeight;

    try {
      const res = await fetch('/chat', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ text: text, user_id: settings.user, llm_url: settings.url, llm_model: settings.model, llm_key: settings.key })
      });
      const data = await res.json();
      container.removeChild(typing);
      
      const chat = chats[currentChatId];
      chat.messages.push({ sender: 'nsm', text: data.response });
      appendBubble('nsm', data.response, chat.messages.length - 1);
      localStorage.setItem('nsm_chats', JSON.stringify(chats));
    } catch (err) {
      container.removeChild(typing);
      appendBubble('nsm', "Error connecting to brain.", 0);
    }
  }

  init();
</script>
</body>
</html>
